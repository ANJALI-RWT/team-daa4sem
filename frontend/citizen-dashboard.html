<!-- citizen-dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Citizen Dashboard | Smart Waste</title>
  <link rel="stylesheet" href="style.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <nav class="sidebar">
    <h2>♻ EcoAI</h2>
    <ul>
      <li><a href="#bins">Smart Bins</a></li>
      <li><a href="#ai">AI Waste Detection</a></li>
      <li><a href="#trucks">Truck Routes</a></li>
      <li><a href="#profile">My Activity</a></li>
      <li><button onclick="logout()">🚪 Logout</button></li>
    </ul>
  </nav>

  <main class="content">
    <section id="bins">
      <h1>🗑 Bin Status</h1>
      <div class="bin-grid" id="binData">
        <!-- JS will inject bin levels -->
      </div>
    </section>

    <section id="ai">
      <h1>🤖 AI Classification</h1>
      <input type="file" accept="image/*" id="wasteImage" />
      <button onclick="classifyWaste()">Analyze</button>
      <div class="result-card" id="aiResult">Upload image to classify.</div>
    </section>

    <section id="trucks">
      <h1>🚛 Nearby Routes</h1>
      <div class="map-placeholder">[🗺 Real-time truck routing soon]</div>
    </section>

    <section id="profile">
      <h1>👤 My Recycling Stats</h1>
      <p>Recycled Items: <span id="recycleCount">0</span></p>
    </section>
  </main>
</body>
</html>
