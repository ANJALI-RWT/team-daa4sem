<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Waste Management - Join the Green Mission</title>
  <link rel="stylesheet" href="style.css" />
  <script src="location.js" defer></script>
</head>
<body>
  <main class="hero">
    <div class="overlay"></div>

    <section class="content">
      <h1>🌱 Join the Green Mission</h1>
      <p>Be part of a smarter, cleaner planet. Register your location and take action today.</p>

      <div class="form-box">
        <p class="role-prompt">👉 Are you a...</p>
        <div class="role-buttons">
          <button onclick="registerRole('citizen')">🚶 Citizen / User</button>
          <button onclick="registerRole('collector')">🚛 Waste Collector</button>
        </div>

        <div id="dynamic-form"></div>
        <div id="status"></div>
      </div>
    </section>
  </main>
</body>
</html>
