<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collector Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 400px; border-radius: 10px; margin-top: 10px; }
    .collector-info { background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .btn-pickup { background-color: #4caf50; color: white; border: none; padding: 5px 10px; margin-top: 5px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

  <main style="padding: 20px; max-width: 1000px; margin: auto;">
    <h1>🚛 Collector Dashboard</h1>

    <div class="collector-info">
      <p><strong>👷 Collector:</strong> <span id="collectorName">Loading...</span></p>
      <p><strong>📍 Location:</strong> <span id="collectorLocation">Detecting...</span></p>
      <p><strong>🚛 Truck Capacity:</strong> <span id="truckCapacity">--</span> tons</p>
    </div>

    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="collector.js"></script>
</body>
</html>
